location = /octop {
    return 302 /octop/;
}

location ^~ /octop/api/internal/mcp/ {
    return 404;
}

location ^~ /octop/ {
    proxy_pass http://127.0.0.1:8089/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Octop-DSM-Remote-Addr $remote_addr;
    proxy_set_header X-Octop-DSM-Server-Addr $server_addr;
    proxy_set_header X-Octop-DSM-Server-Port $server_port;
    proxy_set_header X-Octop-DSM-Scheme $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 0;
}
